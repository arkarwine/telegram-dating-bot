[project]
name = "telegram-dating-bot"
version = "0.1.0"
description = "Myanmar-only Telegram dating bot MVP built with Kurigram and MongoDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kurigram>=2.2.6",
    "motor>=3.6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["deploy*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
