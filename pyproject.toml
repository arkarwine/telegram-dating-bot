[project]
name = "telegram-dating-bot"
version = "0.1.0"
description = "Myanmar-only Telegram dating bot MVP built with Kurigram and MongoDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kurigram>=2.2.6",
    "motor>=3.6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
